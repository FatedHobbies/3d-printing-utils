[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threedpu"
version = "0.1.0"
description = "Offload Bambu Studio slicing from a Manager PC to a Slicer PC on the same network."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
slicer = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
manager = ["PySide6>=6.7", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "PySide6>=6.7"]

[project.scripts]
3dpu-slicer = "threedpu.slicer.__main__:main"

[project.gui-scripts]
3dpu-manager = "threedpu.manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
